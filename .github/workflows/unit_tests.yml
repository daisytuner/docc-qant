name: Unit Tests

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches:
      - main
  schedule:
    - cron: "0 2 * * *"

jobs:
  cpp-tests-linux:
    if: github.repository_owner == 'daisytuner'
    runs-on:
      group: dahlia
      labels: openmp
    container:
      image: daisytuner/docc-build-env-llvm19-ubuntu-24.04:latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Mark GitHub Actions workdir as safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Fetch LFS files
        run: git lfs pull

      - name: Formatting
        shell: bash
        run: |
          shopt -s globstar
          clang-format-19 -style=file --dry-run --Werror plugin/include/**/*.h plugin/src/**/*.cpp plugin/tests/**/*.cpp

      - name: Install Dependencies
        run: |
          apt update
          apt install -y ./qant-native-computing-toolkit.2.3.1-1-amd64.deb

          cd /tmp
          wget -q https://github.com/dmlc/dlpack/archive/refs/tags/v1.2.tar.gz
          tar -xzf v1.2.tar.gz
          cd dlpack-1.2
          cp -r include/dlpack /usr/local/include/

      - name: Build
        run: |
          mkdir build
          cd build
          cmake \
            -G Ninja \
            -DCMAKE_C_COMPILER=clang-19 \
            -DCMAKE_CXX_COMPILER=clang++-19 \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DCMAKE_BUILD_TYPE=Debug \
            -DDOCC_QANT_ENABLE_COVERAGE=ON \
            -DBUILD_TESTS:BOOL=OFF \
            -DBUILD_BENCHMARKS:BOOL=OFF \
            -DBUILD_BENCHMARKS_GOOGLE:BOOL=OFF  \
            ..
          ninja -j$(nproc)
          ninja install

          ./plugin/tests/docc-qant-plugin_test

  python-tests-linux:
    if: github.repository_owner == 'daisytuner'
    runs-on:
      group: dahlia
      labels: openmp
    container:
      image: daisytuner/docc-build-env-llvm19-base:latest-amd64
      options: >-
        --cap-add=PERFMON
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Mark GitHub Actions workdir as safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create virtual environment
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          apt update
          apt install -y ./qant-native-computing-toolkit.2.3.1-1-amd64.deb libdlpack-dev libxtensor-blas-dev xtensor-dev

          python -m pip install --upgrade pip
          pip install pybind11 pytest coverage black==25.9.0 build scikit-build-core
          pip install numpy scipy

          cd /tmp
          wget -q https://github.com/dmlc/dlpack/archive/refs/tags/v1.2.tar.gz
          tar -xzf v1.2.tar.gz
          cd dlpack-1.2
          cp -r include/dlpack /usr/local/include/

      - name: Formatting
        shell: bash
        run: |
          shopt -s globstar
          clang-format-19 -style=file --dry-run --Werror python/bindings/**/*.cpp
          black --check python/docc/ python/tests/

      - name: Build
        run: |
          pip install --no-build-isolation -v -e 3rdParty/docc/python/
          pip install --no-build-isolation -v -e python/

      - name: Unit Tests
        run: |
          export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH
          coverage run --source=python/docc -m pytest -v python/tests/python
          coverage xml

      - name: MLIR Tests
        if: matrix.python-version == '3.11' || matrix.python-version == '3.12' # torch-mlir release is not yet supported on newer versions
        run: |
          # Install torch, torchvision, and torch-mlir (specific versions)
          pip install torch==2.10.0+cpu torchvision==0.25.0+cpu --extra-index-url https://download.pytorch.org/whl/cpu
          pip install torch-mlir==20260512.810 -f https://github.com/llvm/torch-mlir-release/releases/expanded_assets/dev-wheels

          pip install --no-build-isolation -v -e 3rdParty/docc/mlir/

          export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH
          coverage run --source=python/docc -m pytest -v python/tests/mlir
          coverage xml
