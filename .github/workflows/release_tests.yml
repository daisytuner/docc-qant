name: Release Tests

on:
  push:
    branches:
      - main

jobs:
  cpp-tests-linux:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Mark GitHub Actions workdir as safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Fetch LFS files
        run: git lfs pull

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git-lfs \
            cmake \
            ninja-build \
            clang-19 \
            libgmp-dev \
            libcurl4-gnutls-dev \
            libisl-dev \
            nlohmann-json3-dev \
            libopenblas-dev

          sudo apt install -y ./qant-native-computing-toolkit.2.1.0-1-amd64.deb

          cd /tmp
          wget -q https://github.com/dmlc/dlpack/archive/refs/tags/v1.2.tar.gz
          tar -xzf v1.2.tar.gz
          cd dlpack-1.2
          sudo cp -r include/dlpack /usr/local/include/

      - name: Build
        run: |
          mkdir build
          cd build
          cmake \
            -G Ninja \
            -DCMAKE_C_COMPILER=clang-19 \
            -DCMAKE_CXX_COMPILER=clang++-19 \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DCMAKE_BUILD_TYPE=Debug \
            -DDOCC_QANT_ENABLE_COVERAGE=ON \
            -DBUILD_TESTS:BOOL=OFF \
            -DBUILD_BENCHMARKS:BOOL=OFF \
            -DBUILD_BENCHMARKS_GOOGLE:BOOL=OFF  \
            ..
          ninja -j$(nproc)
          sudo ninja install

          ./plugin/tests/docc-qant-plugin_test

  python-tests-linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Mark GitHub Actions workdir as safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Fetch LFS files
        run: git lfs pull

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create virtual environment
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git-lfs \
            cmake \
            ninja-build \
            clang-19 \
            libgmp-dev \
            libcurl4-gnutls-dev \
            libisl-dev \
            nlohmann-json3-dev \
            libopenblas-dev

          sudo apt install -y ./qant-native-computing-toolkit.2.1.0-1-amd64.deb

          cd /tmp
          wget -q https://github.com/dmlc/dlpack/archive/refs/tags/v1.2.tar.gz
          tar -xzf v1.2.tar.gz
          cd dlpack-1.2
          sudo cp -r include/dlpack /usr/local/include/
          cd "$GITHUB_WORKSPACE"

          python -m pip install --upgrade pip
          pip install scikit-build-core pybind11 pytest coverage black==25.9.0

      - name: Build
        run: |
          pip install --no-build-isolation -v -e 3rdParty/docc/python/
          pip install --no-build-isolation -v -e python/

      - name: Unit Tests
        run: |
          export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH
          pytest -v python/tests/python

      - name: MLIR Tests
        if: matrix.python-version == '3.11' || matrix.python-version == '3.12' # torch-mlir release is not yet supported on newer versions
        run: |
          # Install MLIR/LLVM 19 development packages needed to build docc-ai
          sudo apt install -y libmlir-19-dev mlir-19-tools

          # Install torch-mlir
          pip install torch-mlir torchvision --extra-index-url https://download.pytorch.org/whl/cpu -f https://github.com/llvm/torch-mlir-release/releases/expanded_assets/dev-wheels

          pip install --no-build-isolation -v -e 3rdParty/docc/mlir/

          export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH
          pytest -v python/tests/mlir
